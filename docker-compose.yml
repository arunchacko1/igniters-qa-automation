services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-igniters_qa}
      POSTGRES_USER: ${POSTGRES_USER:-igniters}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-locally}
    ports:
      - "${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-igniters}"]
      interval: 5s
      timeout: 5s
      retries: 10

  sut:
    build:
      context: .
      dockerfile: sut-app/Dockerfile
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-igniters_qa}
      POSTGRES_USER: ${POSTGRES_USER:-igniters}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-locally}
      QA_DEFECTS_ENABLED: ${QA_DEFECTS_ENABLED:-false}
      SUT_PORT: 8080
    ports:
      - "${SUT_PORT:-8080}:8080"
