server:
  port: ${SUT_PORT:8080}

spring:
  application:
    name: sut-app

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${POSTGRES_DB:igniters_qa}
    username: ${POSTGRES_USER:igniters}
    password: ${POSTGRES_PASSWORD:change-me-locally}

  jpa:
    # Flyway owns the schema. Hibernate only validates that entities match
    # what Flyway created, so a mismatch fails fast instead of silently
    # auto-altering the database.
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration

  thymeleaf:
    cache: false

# Our own setting, not Spring's. See QaDefectsProperties.
igniters:
  qa-defects-enabled: ${QA_DEFECTS_ENABLED:false}

logging:
  level:
    org.igniters.qa.sut: INFO
